name: SEP candidate scout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m sep_scout --write-sheet --limit 20
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SEP_SPREADSHEET_ID: ${{ secrets.SEP_SPREADSHEET_ID }}
          SEP_SHEET_NAME: Web Prospects
      - uses: actions/upload-artifact@v4
        with:
          name: sep-candidate-results
          path: data/latest_candidates.json
